name: apply commercial alpha benchmark

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: threecountry-commercial-alpha-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'commercial-alpha' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout commercial alpha branch
        uses: actions/checkout@v4
        with:
          ref: commercial-alpha
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reassemble, replace and verify source
        shell: bash
        run: |
          set -euo pipefail
          single='.commercial-alpha-bootstrap/source.tar.xz.b64'
          if [ -s "$single" ]; then
            base64 --decode "$single" > /tmp/threecountry-commercial-alpha.tar.xz
          else
            count=$(find .commercial-alpha-bootstrap -maxdepth 1 -name 'source.tar.xz.b64.part*' | wc -l)
            test "$count" -eq 5
            cat .commercial-alpha-bootstrap/source.tar.xz.b64.part* | base64 --decode > /tmp/threecountry-commercial-alpha.tar.xz
          fi
          rm -rf /tmp/threecountry-commercial-alpha
          mkdir -p /tmp/threecountry-commercial-alpha
          tar -xJf /tmp/threecountry-commercial-alpha.tar.xz -C /tmp/threecountry-commercial-alpha

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '.commercial-alpha-bootstrap' -exec rm -rf {} +
          rm -rf .github/workflows
          cp -a /tmp/threecountry-commercial-alpha/. .
          rm -rf .commercial-alpha-bootstrap
          rm -f .github/workflows/bootstrap-commercial-alpha.yml

          npm run build

      - name: Commit verified commercial alpha
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add isolated commercial alpha benchmark'
          git push origin HEAD:commercial-alpha
