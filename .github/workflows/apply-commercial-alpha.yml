name: apply commercial alpha overlay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-commercial-alpha.yml'
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: threecountry-commercial-alpha-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'push' || (github.event.pull_request.head.ref == 'commercial-alpha' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout commercial alpha branch
        uses: actions/checkout@v4
        with:
          ref: commercial-alpha
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reassemble and apply verified v0.8 overlay
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .commercial-v08-bootstrap -maxdepth 1 -name 'overlay.tar.xz.b64.part*' 2>/dev/null | wc -l)
          test "$count" -eq 3
          cat .commercial-v08-bootstrap/overlay.tar.xz.b64.part* | base64 --decode > /tmp/threecountry-commercial-v08.tar.xz
          tar -xJf /tmp/threecountry-commercial-v08.tar.xz -C .

          rm -f character-art-v1.js character-art-v1.css pixel-geometry-fix.css
          rm -rf .commercial-v08-bootstrap .commercial-alpha-bootstrap
          rm -f .github/workflows/bootstrap-commercial-alpha.yml
          rm -f .github/workflows/apply-character-art-assets.yml
          rm -f .github/workflows/apply-commercial-v07.yml
          rm -f .github/workflows/apply-commercial-v08.yml

          npm ci
          npm run build
          test -s dist/character-art-v2.js
          test -s dist/story-director-v2.js
          grep -q 'Commercial Art Alpha' dist/index.html
          ! grep -q 'character-art-v1' dist/index.html
          ! grep -q 'pixel-geometry-fix' dist/index.html

      - name: Commit verified commercial alpha v0.8
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No commercial alpha changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add vector character art and branching story alpha'
          git push origin HEAD:commercial-alpha
