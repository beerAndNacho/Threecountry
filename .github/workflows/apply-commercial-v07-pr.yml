name: materialize commercial SRPG v0.7

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: materialize-commercial-v07-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'commercial-v0.7' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: commercial-v0.7
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply additive commercial source patch
        run: node scripts/apply-commercial-v07.mjs
      - name: Install and verify
        run: |
          npm ci
          npm run build
      - name: Verify build graph
        run: |
          set -euo pipefail
          for file in index.html commercial-v1.css commercial-data.js forecast-action.js commercial-v1.js engine.js character-art-v1.js; do
            test -s "dist/${file}"
          done
          grep -q 'commercial-v1.js?v=20260819-1' dist/index.html
          grep -q 'commercial-v1.css?v=20260819-1' dist/index.html
          grep -q '__commercialV07' dist/commercial-v1.js
          grep -q 'forecastAction' dist/forecast-action.js
          grep -q 'imperial-sabre' dist/commercial-data.js
      - name: Commit generated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add commercial-data.js commercial-v1.js index.html scripts/build.mjs package.json package-lock.json README.md
          git commit -m 'feat: integrate commercial progression equipment and forecast'
          git push origin HEAD:commercial-v0.7
