name: apply commercial art alpha v0.8

on:
  push:
    branches: [commercial-alpha]
    paths:
      - '.commercial-v08-bootstrap/**'
      - '.github/workflows/apply-commercial-v08.yml'

permissions:
  contents: write

concurrency:
  group: threecountry-commercial-v08-apply
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout commercial alpha
        uses: actions/checkout@v4
        with:
          ref: commercial-alpha
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect overlay payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .commercial-v08-bootstrap -maxdepth 1 -name 'overlay.tar.xz.b64.part*' 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 3 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "Waiting for all 3 overlay parts; found $count."
          fi

      - name: Apply vector character and story overlay
        if: steps.payload.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .commercial-v08-bootstrap/overlay.tar.xz.b64.part* | base64 --decode > /tmp/threecountry-commercial-v08.tar.xz
          tar -xJf /tmp/threecountry-commercial-v08.tar.xz -C .

          rm -f character-art-v1.js character-art-v1.css pixel-geometry-fix.css
          rm -rf .commercial-v08-bootstrap .commercial-alpha-bootstrap
          rm -f .github/workflows/bootstrap-commercial-alpha.yml
          rm -f .github/workflows/apply-character-art-assets.yml
          rm -f .github/workflows/apply-commercial-v07.yml

          cat > .github/workflows/ci.yml <<'YAML'
          name: ci

          on:
            push:
              branches: [main, commercial-alpha]
            pull_request:

          permissions:
            contents: read

          concurrency:
            group: threecountry-srpg-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            test:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                - name: Install
                  run: npm ci
                - name: Build and test
                  run: npm run build
                - name: Verify deployable commercial alpha files
                  run: |
                    test -s dist/index.html
                    test -s dist/styles.css
                    test -s dist/gameplay-v4.css
                    test -s dist/character-art-v2.css
                    test -s dist/story-director-v2.css
                    test -s dist/app.js
                    test -s dist/gameplay-v4.js
                    test -s dist/character-art-v2.js
                    test -s dist/story-director-v2.js
                    grep -q 'character-art-v2.js' dist/index.html
                    grep -q 'story-director-v2.js' dist/index.html
                    ! grep -q 'character-art-v1' dist/index.html
                    ! grep -q 'pixel-geometry-fix' dist/index.html
          YAML

          npm ci
          npm run build
          test -s dist/character-art-v2.js
          test -s dist/story-director-v2.js
          grep -q 'Commercial Art Alpha' dist/index.html
          ! grep -q 'character-art-v1' dist/index.html
          ! grep -q 'pixel-geometry-fix' dist/index.html

      - name: Commit verified alpha overlay
        if: steps.payload.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add vector character art and branching story alpha'
          git push origin HEAD:commercial-alpha
