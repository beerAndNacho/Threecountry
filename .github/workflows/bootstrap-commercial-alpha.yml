name: bootstrap commercial alpha source

on:
  push:
    branches: [commercial-alpha]
    paths:
      - '.commercial-alpha-bootstrap/**'
      - '.github/workflows/bootstrap-commercial-alpha.yml'

permissions:
  contents: write

concurrency:
  group: threecountry-commercial-alpha-bootstrap
  cancel-in-progress: true

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: commercial-alpha
          fetch-depth: 0

      - name: Verify payload
        id: payload
        shell: bash
        run: |
          count=$(find .commercial-alpha-bootstrap -maxdepth 1 -name 'source.tar.xz.b64.part*' 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count of 5 payload parts."

      - name: Unpack and test source
        if: steps.payload.outputs.count == '5'
        shell: bash
        run: |
          set -euo pipefail
          cat .commercial-alpha-bootstrap/source.tar.xz.b64.part* | base64 --decode > /tmp/threecountry-commercial-alpha.tar.xz
          rm -rf /tmp/threecountry-commercial-alpha
          mkdir -p /tmp/threecountry-commercial-alpha
          tar -xJf /tmp/threecountry-commercial-alpha.tar.xz -C /tmp/threecountry-commercial-alpha

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '.commercial-alpha-bootstrap' -exec rm -rf {} +
          rm -rf .github/workflows
          cp -a /tmp/threecountry-commercial-alpha/. .
          rm -rf .commercial-alpha-bootstrap
          rm -f .github/workflows/bootstrap-commercial-alpha.yml

          npm run build

      - name: Commit verified benchmark
        if: steps.payload.outputs.count == '5'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add commercial alpha tactical benchmark'
          git push origin HEAD:commercial-alpha
