name: bootstrap SRPG v2 source

on:
  push:
    branches: [srpg-v2]
    paths:
      - '.bootstrap-srpg-v2/**'
      - '.github/workflows/bootstrap-srpg-v2.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-threecountry-srpg-v2
  cancel-in-progress: true

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: srpg-v2
          fetch-depth: 0

      - name: Check payload completeness
        id: payload
        shell: bash
        run: |
          count=$(find .bootstrap-srpg-v2 -maxdepth 1 -name 'source.zip.b64.part*' 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count of 3 payload parts."

      - name: Unpack, replace and verify SRPG v2
        if: steps.payload.outputs.count == '3'
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-srpg-v2/source.zip.b64.part* | base64 --decode > /tmp/threecountry-srpg-v2-source.zip
          rm -rf /tmp/threecountry-srpg-v2-unpack
          mkdir -p /tmp/threecountry-srpg-v2-unpack
          unzip -q /tmp/threecountry-srpg-v2-source.zip -d /tmp/threecountry-srpg-v2-unpack
          source_dir='/tmp/threecountry-srpg-v2-unpack/threecountry-srpg-v2'
          test -d "$source_dir/src"

          rm -rf src dist tests scripts
          rm -f index.html package.json package-lock.json .gitignore
          cp -R "$source_dir/src" "$source_dir/dist" "$source_dir/tests" "$source_dir/scripts" .
          cp "$source_dir/index.html" "$source_dir/package.json" "$source_dir/package-lock.json" "$source_dir/.gitignore" .
          cp "$source_dir/README.md" README.md
          mkdir -p docs .github/workflows
          cp "$source_dir/docs/10-SRPG-V2-HANDOFF.md" docs/10-SRPG-V2-HANDOFF.md
          cp "$source_dir/.github/workflows/ci.yml" .github/workflows/ci.yml

          rm -rf .bootstrap-srpg-v2
          rm -f .github/workflows/bootstrap-srpg-v2.yml

          npm ci
          npm test

      - name: Commit verified SRPG v2
        if: steps.payload.outputs.count == '3'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement playable grid-based SRPG v2'
          git push origin HEAD:srpg-v2
