name: ci

on:
  push:
    branches: [main, commercial-alpha]
  pull_request:

permissions:
  contents: read

concurrency:
  group: threecountry-srpg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build and test
        run: npm run build
      - name: Run 1,000 deterministic balance simulations
        run: npm run quality
      - name: Verify deployable files
        run: |
          test -s dist/index.html
          test -s dist/styles.css
          test -s dist/gameplay-v4.css
          test -s dist/character-art-v2.css
          test -s dist/story-director-v2.css
          test -s dist/commercial-combat-v3.css
          test -s dist/campaign-story-v3.css
          test -s dist/operation-campaign-v1.css
          test -s dist/app.js
          test -s dist/character-art-v2.js
          test -s dist/story-director-v2.js
          test -s dist/commercial-combat-v3.js
          test -s dist/campaign-story-v3.js
          test -s dist/operation-campaign-v1.js
          grep -q 'Operation Campaign Alpha' dist/index.html
          grep -q 'operation-campaign-v1.js' dist/index.html
          ! grep -q 'character-art-v1' dist/index.html
          ! grep -q 'pixel-geometry-fix' dist/index.html
