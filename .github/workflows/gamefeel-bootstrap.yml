name: apply game-feel v2

on:
  push:
    branches: [main]
    paths:
      - '.gamefeel-bootstrap/**'
      - '.github/workflows/gamefeel-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: threecountry-gamefeel-bootstrap
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .gamefeel-bootstrap -maxdepth 1 -name 'payload.b64.part*' 2>/dev/null | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          test "$count" -eq 3
      - name: Apply source overlay and test
        shell: bash
        run: |
          set -euo pipefail
          cat .gamefeel-bootstrap/payload.b64.part* | base64 --decode > /tmp/gamefeel.tar.xz
          tar -xJf /tmp/gamefeel.tar.xz
          rm -rf .gamefeel-bootstrap
          rm -f .github/workflows/gamefeel-bootstrap.yml
          npm ci
          npm test
      - name: Commit game-feel v2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: turn the vertical slice into a cinematic game experience'
          git push
